
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASCND — Admin Dashboard</title>

<script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

    * {
        box-sizing: border-box;
    }

    html {
        background: #0b0b0b;
    }

    body {
        margin: 0;
        font-family:
            Arial,
            Helvetica,
            sans-serif;
        background: #0b0b0b;
        color: #f5f5f5;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {
        background: #090909;
        color: white;
        padding: 22px 38px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #242424;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 5px;
    }

    .admin-label {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: #777;
    }


    /* =====================================================
       MAIN
       ===================================================== */

    main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 48px 30px 80px;
    }

    .page-heading {
        margin-bottom: 38px;
    }

    .page-heading h1 {
        margin: 0 0 8px;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -1px;
        color: #ffffff;
    }

    .page-heading p {
        margin: 0;
        color: #777;
        font-size: 14px;
    }


    /* =====================================================
       OVERVIEW
       ===================================================== */

    .overview-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 48px;
    }

    .overview-card {
        background: #111111;
        border: 1px solid #242424;
        padding: 25px;
        border-radius: 8px;
        transition:
            border-color 0.2s ease,
            transform 0.2s ease;
    }

    .overview-card:hover {
        border-color: #3a3a3a;
        transform: translateY(-2px);
    }

    .overview-label {
        font-size: 9px;
        letter-spacing: 2px;
        color: #777;
        margin-bottom: 12px;
    }

    .overview-value {
        font-size: 32px;
        font-weight: 700;
        color: #ffffff;
    }


    /* =====================================================
       SECTION
       ===================================================== */

    .section-heading {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: #777;
        margin-bottom: 14px;
    }


    /* =====================================================
       ASSESSMENT LIST
       ===================================================== */

    #assessment-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .assessment-card {
        background: #111111;
        border: 1px solid #242424;
        border-radius: 8px;
        padding: 25px;
        cursor: pointer;
        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .assessment-card:hover {
        background: #141414;
        border-color: #444;
        transform: translateY(-2px);
        box-shadow:
            0 10px 30px
            rgba(0, 0, 0, 0.25);
    }

    .assessment-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
    }

    .business-name {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #ffffff;
    }

    .contact-name {
        font-size: 13px;
        color: #777;
    }


    /* =====================================================
       PRIORITY
       ===================================================== */

    .priority {
        display: inline-flex;
        align-items: center;
        padding: 7px 11px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
        white-space: nowrap;
    }

    .priority-high {
        background: #ffffff;
        color: #090909;
    }

    .priority-medium {
        background: #292929;
        color: #ffffff;
        border: 1px solid #3c3c3c;
    }

    .priority-low {
        background: #181818;
        color: #777;
        border: 1px solid #292929;
    }


    /* =====================================================
       DETAILS
       ===================================================== */

    .assessment-details {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #242424;
    }

    .detail-label {
        font-size: 9px;
        letter-spacing: 1.5px;
        color: #666;
        margin-bottom: 7px;
    }

    .detail-value {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        color: #d8d8d8;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status-control {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .status-select {
        background: #181818;
        color: #ffffff;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: 600;
        outline: none;
        cursor: pointer;
    }

    .status-select:focus {
        border-color: #666;
    }

    .status-update-button {
        background: #ffffff;
        color: #090909;
        border: none;
        border-radius: 4px;
        padding: 8px 11px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition:
            opacity 0.2s ease,
            transform 0.2s ease;
    }

    .status-update-button:hover {
        opacity: 0.8;
        transform: translateY(-1px);
    }


    /* =====================================================
       EMPTY STATE
       ===================================================== */

    .empty-state {
        background: #111111;
        border: 1px solid #242424;
        padding: 55px;
        text-align: center;
        color: #666;
        border-radius: 8px;
    }


    /* =====================================================
       DETAIL VIEW
       ===================================================== */

    #detail-view {
        display: none;
    }

    .back-button {
        border: none;
        background: none;
        padding: 0;
        margin-bottom: 30px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        cursor: pointer;
        color: #777;
        transition: color 0.2s ease;
    }

    .back-button:hover {
        color: #ffffff;
    }

    .detail-header {
        background: #111111;
        border: 1px solid #242424;
        padding: 30px;
        border-radius: 8px;
        margin-bottom: 18px;
    }

    .detail-header-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
    }

    .detail-business-name {
        margin: 0 0 8px;
        font-size: 32px;
        color: #ffffff;
    }

    .detail-contact-name {
        color: #777;
        font-size: 14px;
    }

    .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        margin-bottom: 18px;
    }

    .detail-card {
        background: #111111;
        border: 1px solid #242424;
        padding: 28px;
        border-radius: 8px;
    }

    .detail-card.full {
        grid-column: 1 / -1;
    }

    .detail-card h3 {
        margin: 0 0 20px;
        font-size: 10px;
        letter-spacing: 2px;
        color: #777;
    }

    .detail-card p {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: #cfcfcf;
    }

    .info-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #242424;
    }

    .info-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
    }

    .info-row-label {
        color: #666;
        font-size: 10px;
        letter-spacing: 1px;
    }

    .info-row-value {
        font-weight: 600;
        text-align: right;
        color: #d8d8d8;
    }

    .item-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .item {
        padding: 13px 15px;
        background: #181818;
        border: 1px solid #242424;
        border-radius: 5px;
        font-size: 13px;
        color: #cfcfcf;
    }

    .no-data {
        color: #666;
        font-size: 13px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 900px) {

        .overview-grid {
            grid-template-columns: 1fr;
        }

        .assessment-details {
            grid-template-columns: 1fr 1fr;
        }

        .detail-grid {
            grid-template-columns: 1fr;
        }

    }


    @media (max-width: 600px) {

        main {
            padding: 30px 18px 60px;
        }

        header {
            padding: 20px;
        }

        .page-heading h1 {
            font-size: 30px;
        }

        .assessment-top {
            flex-direction: column;
        }

        .assessment-details {
            grid-template-columns: 1fr;
        }

        .detail-header-top {
            flex-direction: column;
        }

        .detail-business-name {
            font-size: 26px;
        }

        .status-control {
            flex-wrap: wrap;
        }

    }

/* =====================================================
   THEME TOGGLE
   ===================================================== */

.theme-toggle-wrapper {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 9px;

    margin-bottom: 28px;
}


.theme-label {

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.5px;

    color: #666;

    transition:
        color 0.2s ease;
}


.theme-toggle {

    border: none;

    background: transparent;

    padding: 0;

    cursor: pointer;
}


.theme-toggle-track {

    width: 42px;

    height: 22px;

    display: block;

    position: relative;

    border-radius: 20px;

    background: #292929;

    border: 1px solid #444;

    transition:
        background 0.25s ease,
        border-color 0.25s ease;
}


.theme-toggle-thumb {

    width: 14px;

    height: 14px;

    position: absolute;

    top: 3px;

    left: 22px;

    border-radius: 50%;

    background: #ffffff;

    transition:
        transform 0.25s ease;
}

<body>

    

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

    <div class="brand">
        ASCND
    </div>

    <div class="header-statement"> SEE THE OPPORTUNITY. BUILD THE SYSTEM. 
        
    </div>

    <div class="admin-header-right">

        <div class="admin-label">

        </div>


        <button
            type="button"

</header>


    <!-- =====================================================
         ASSESSMENT LIST VIEW
         ===================================================== -->
<main>

    <div class="theme-toggle-wrapper">

        <span class="theme-label">
            LIGHT
        </span>

        <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"

                <span

        </span>

    </div>


    <div id="list-view">


        <div class="page-heading">

            <h1>

            </h1>

                Review businesses and prioritize your next opportunities.
            </p>

        </div>


        <div class="overview-grid">


            <div class="overview-card">

                <div class="overview-label">
                    TOTAL ASSESSMENTS
                </div>


                <div
                    id="total-assessments"

            </div>

                </div>


                <div
                    id="high-priority"

                >

                </div>

            </div>

                <div class="overview-label">
                    NEW
                </div>


                <div
                    id="new-assessments"
                    class="overview-value"

                </div>

        <button
            type="button"

        </button>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        let assessments = [];

    /* =====================================================
   SUPABASE AUTHENTICATION
   ===================================================== */

const SUPABASE_URL =
    "https://ocmevcjgxypqkqqjiuyt.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ttzLLIMwICPzXIPzwKnTmA_hyIkfbXf";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


async function checkAdminAuthentication() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (
        error ||
        !data.session
    ) {

        window.location.href =
            "/admin-login.html";

        return false;

    }


    return true;

}

        /* =====================================================
           LOAD ASSESSMENTS
           ===================================================== */

        async function loadAssessments() {

            const list =
                document.getElementById(
                    "assessment-list"
                );


            try {

                const response =
                    await fetch(
                        "/api/assessments"
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        "Unable to load assessments."
                    );

                }


                assessments =
                    result.assessments || [];


                document.getElementById(
                    "total-assessments"
                ).textContent =
                    assessments.length;


                const highPriority =
                    assessments.filter(
                        function (assessment) {

                            return (
                                assessment.priority ===
                                "HIGH"
                            );

                        }
                    ).length;


                document.getElementById(
                    "high-priority"
                ).textContent =
                    highPriority;


                const newAssessments =
                    assessments.filter(
                        function (assessment) {

                            return (
                                (
                                    assessment.status ||
                                    "NEW"
                                ) ===
                                "NEW"
                            );

                        }
                    ).length;


                document.getElementById(
                    "new-assessments"
                ).textContent =
                    newAssessments;


                if (
                    assessments.length === 0
                ) {

                    list.innerHTML = `

                        <div class="empty-state">

                            No assessments yet.

                        </div>

                    `;

                    return;

                }


                list.innerHTML =
                    assessments
                        .map(
                            function (assessment) {

                                return createAssessmentCard(
                                    assessment
                                );

                            }
                        )
                        .join("");

            }

            catch (error) {

                console.error(
                    "ASCND ADMIN ERROR:",
                    error
                );


                list.innerHTML = `

                    <div class="empty-state">

                        Unable to load assessments.

                    </div>

                `;

            }

        }


        /* =====================================================
           CREATE ASSESSMENT CARD
           ===================================================== */

        function createAssessmentCard(
    assessment
) {

    const priority =
        assessment.priority ||
        "LOW";


    const status =
        assessment.status ||
        "NEW";


    return `

        <div
            class="assessment-card"
            onclick="showAssessment('${assessment.id}')"
        >


            <div class="assessment-top">


                <div>

                    <div class="business-name">

                        ${
                            escapeHtml(
                                assessment.business_name ||
                                "Unnamed Business"
                            )
                        }

                    </div>


                    <div class="contact-name">

                        ${
                            escapeHtml(
                                assessment.contact_name ||
                                "No contact name"
                            )
                        }

                    </div>

                </div>


                <div
                    class="
                        priority
                        priority-${priority.toLowerCase()}
                    "
                >

                    ${priority}

                </div>


            </div>


            <div class="assessment-details">


                <div>

                    <div class="detail-label">

                        PRIMARY OPPORTUNITY

                    </div>


                    <div class="detail-value">

                        ${
                            escapeHtml(
                                assessment.primary_opportunity ||
                                "Not available"
                            )
                        }

                    </div>

                </div>


                <div>

                    <div class="detail-label">

                        TIMELINE

                    </div>


                    <div class="detail-value">

                        ${
                            escapeHtml(
                                assessment.timeline ||
                                "Not specified"
                            )
                        }

                    </div>

                </div>


                <div>

                    <div class="detail-label">

                        STATUS

                    </div>


                    <div class="status-control">

                        <select
                            class="status-select"
                            data-assessment-id="${assessment.id}"
                            onclick="event.stopPropagation()"
                        >

                            <option
                                value="NEW"
                                ${
                                    status === "NEW"
                                        ? "selected"
                                        : ""
                                }
                            >
                                NEW
                            </option>


                            <option
                                value="CONTACTED"
                                ${
                                    status === "CONTACTED"
                                        ? "selected"
                                        : ""
                                }
                            >
                                CONTACTED
                            </option>


                            <option
                                value="DISCOVERY"
                                ${
                                    status === "DISCOVERY"
                                        ? "selected"
                                        : ""
                                }
                            >
                                DISCOVERY
                            </option>


                            <option
                                value="PROPOSAL"
                                ${
                                    status === "PROPOSAL"
                                        ? "selected"
                                        : ""
                                }
                            >
                                PROPOSAL
                            </option>


                            <option
                                value="ACTIVE"
                                ${
                                    status === "ACTIVE"
                                        ? "selected"
                                        : ""
                                }
                            >
                                ACTIVE
                            </option>


                            <option
                                value="COMPLETED"
                                ${
                                    status === "COMPLETED"
                                        ? "selected"
                                        : ""
                                }
                            >
                                COMPLETED
                            </option>

                        </select>


                        <button
                            type="button"
                            class="status-update-button"
                            onclick="
                                event.stopPropagation();
                                updateAssessmentStatus(
                                    '${assessment.id}',
                                    this
                                );
                            "
                        >

                            UPDATE

                        </button>

                    </div>

                </div>


                <div>

/* =====================================================
   UPDATE ASSESSMENT STATUS
   ===================================================== */

async function updateAssessmentStatus(
    assessmentId,
    button
) {

    const card =
        button.closest(
            ".assessment-card"
        );


    const select =
        card.querySelector(
            ".status-select"
        );


    const newStatus =
        select.value;


    button.disabled =
        true;


    button.textContent =
        "SAVING...";


    try {

        const response =
            await fetch(
                `/api/assessments/${assessmentId}/status`,
                {

                    method:
                        "PATCH",

                    headers:
                        {

                            "Content-Type":
                                "application/json"

                        },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Unable to update assessment status."
            );

        }


        console.log(
            "ASCND STATUS UPDATED:",
            result
        );


        button.textContent =
            "UPDATED";


        /*
         * Refresh the assessment list
         * so the dashboard reflects
         * the new status immediately.
         */

button.disabled =
    true;


await loadAssessments();

    }

    catch (error) {

        console.error(
            "ASCND STATUS UPDATE ERROR:",
            error
        );


        alert(
            "Unable to update the assessment status."
        );


        button.disabled =
            false;


        button.textContent =
            "UPDATE";

    }

}

        /* =====================================================
           RENDER LIST
           ===================================================== */

        function renderList(
            items
        ) {

            if (
                !items ||
                items.length === 0
            ) {

                return `

                    <div class="no-data">

                        None provided.

                    </div>

                `;

            }


            return `

                <div class="item-list">

                    ${
                        items
                            .map(
                                function (item) {

                                    let text =
                                        item;


                                    if (
                                        typeof item ===
                                        "object"
                                    ) {

                                        text =
                                            item.name ||
                                            item.title ||
                                            item.system ||
                                            item.description ||
                                            JSON.stringify(
                                                item
                                            );

                                    }


                                    return `

                                        <div class="item">

                                            ${
                                                escapeHtml(
                                                    String(text)
                                                )
                                            }

                                        </div>

                                    `;

                                }
                            )
                            .join("")
                    }

                </div>

            `;

        }

        /* =====================================================
           ARRAY NORMALIZER
           ===================================================== */

        function normalizeArray(
            value
        ) {

            if (
                Array.isArray(value)
            ) {

                return value;

            }


            if (
                typeof value ===
                "string"
            ) {

                return [
                    value
                ];

            }


            return [];

        }


        /* =====================================================
           DATE
           ===================================================== */

        function formatDate(
            date
        ) {

            if (!date) {

                return "—";

            }


            return new Date(
                date
            ).toLocaleDateString();

        }


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(
            value
        ) {

            return String(
                value
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

const themeToggle =
    document.getElementById(
        "theme-toggle"
    );


const savedTheme =
    localStorage.getItem(
        "ascnd-admin-theme"
    );


if (
    savedTheme === "light"
) {

    document.body.classList.add(
        "light-mode"
    );

}


if (themeToggle) {

    themeToggle.addEventListener(
        "click",
        function () {

            document.body.classList.toggle(
                "light-mode"
            );


            const isLight =
                document.body.classList.contains(
                    "light-mode"
                );


            localStorage.setItem(

                "ascnd-admin-theme",

                isLight
                    ? "light"
                    : "dark"

            );

        }
    );

}

const logoutButton =

    try {

        await supabaseClient.auth.signOut();

    }

    catch (error) {

        console.error(
            "ASCND LOGOUT ERROR:",
            error
        );

    }


    window.location.href =
        "/admin-login.html";

}

    logoutButton.addEventListener(
        "click",
        logoutAdmin
    );

}


/* =====================================================
   ASCND ADMIN AUTO LOGOUT
   ===================================================== */

const INACTIVITY_LIMIT =
    30 * 60 * 1000;


let inactivityTimer;


function resetInactivityTimer() {

    clearTimeout(
        inactivityTimer
    );


    inactivityTimer =
        setTimeout(
            function () {

                logoutAdmin();

            },
            INACTIVITY_LIMIT
        );

}


const activityEvents = [

    "mousemove",

    "mousedown",

    "keydown",

    "scroll",

    "touchstart",

    "click"

];


activityEvents.forEach(
    function (eventName) {

        document.addEventListener(
            eventName,
            resetInactivityTimer,
            true
        );

    }
);


resetInactivityTimer();
